# docker-compose.test.yml
#
# Long-lived test Postgres for `npm test --workspace=server`. Pinned to
# port 55432 (matching the DATABASE_URL convention in .env / .env.example)
# and bound to 127.0.0.1 only - this is never exposed externally.
#
# Trust auth is intentional: this container is dev-only and never holds
# production data. The user `skf_s` and database `resona_dev` match
# server/db.js conventions and the existing .env DATABASE_URL.
#
# Usage:
#   scripts/test-db-up.sh    # start + wait for ready
#   scripts/test-db-down.sh  # stop and clear volumes
#
# Why this exists: prior to this file, every test run inside an episode
# stood up an ad-hoc PG inside the test process's group, which died with
# the process and held the port from re-bind. Across 4 episodes
# (admin-dashboard Phase A, D, B1, B2) the verify stage could not
# re-execute tests against PG. A persistent compose-managed container
# closes that friction loop.
services:
  postgres:
    image: postgres:16
    container_name: resona-test-pg
    environment:
      POSTGRES_USER: skf_s
      POSTGRES_DB: resona_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skf_s -d resona_dev"]
      interval: 2s
      timeout: 3s
      retries: 15
    # No named volume by default; on `down -v` the data is wiped, which
    # is exactly what test isolation wants. If you need a persisted dev
    # DB instead, run `docker compose up -d postgres` from your own
    # compose file - this one is opinionated for tests.

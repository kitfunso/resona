services:
  postgres:
    image: postgres:16
    container_name: resona-test-pg
    environment:
      POSTGRES_USER: skf_s
      POSTGRES_DB: resona_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skf_s -d resona_dev"]
      interval: 2s
      timeout: 3s
      retries: 15

name = "resona-devday-sensor"
main = "index.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "AnalysisQuota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AnalysisQuota"]

# Fly.io deployment config for Resona.
# First-time setup is documented in docs/DEPLOY.md. Secrets (DATABASE_URL,
# SESSION_SECRET, ADMIN_TOKEN, OPENAI_API_KEY) are NOT stored here — set them
# with `fly secrets set`.

app = "resona"
primary_region = "lhr"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3030"
  ALLOWED_ORIGINS = "https://resona.fly.dev"

[http_service]
  internal_port = 3030
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "12s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
